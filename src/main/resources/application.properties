# ============================================================
# APPLICATION CONFIGURATION
# ============================================================
spring.application.name=products-app
server.port=8080

# ============================================================
# DATABASE — H2 (in-memory, actif par défaut)
# ============================================================
spring.datasource.url=jdbc:h2:mem:productsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# DATABASE — MySQL (décommenter pour utiliser MySQL)
# ============================================================
#spring.datasource.url=jdbc:mysql://localhost:3306/productsdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Pour MySQL : org.hibernate.dialect.MySQLDialect

# ============================================================
# THYMELEAF
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
