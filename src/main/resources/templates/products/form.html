<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title th:text="${formTitle}">Formulaire Produit</title>
</head>

<body>
<div layout:fragment="content">

    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

            <!-- CARD FORMULAIRE -->
            <div class="card shadow">
                <div class="card-header card-header-custom">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-box me-2"></i>
                        <span th:text="${formTitle}">Formulaire Produit</span>
                    </h4>
                </div>

                <div class="card-body p-4">
                    <form th:action="${formAction}"
                          th:object="${product}"
                          method="post"
                          novalidate>

                        <!-- NOM -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">
                                <i class="bi bi-tag me-1"></i>Nom du produit
                                <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   class="form-control"
                                   placeholder="Ex: Laptop Dell XPS">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}">Erreur</div>
                        </div>

                        <!-- PRIX -->
                        <div class="mb-3">
                            <label for="price" class="form-label fw-semibold">
                                <i class="bi bi-currency-dollar me-1"></i>Prix (MAD)
                                <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <input type="number"
                                       id="price"
                                       th:field="*{price}"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                       class="form-control"
                                       step="0.01"
                                       min="0"
                                       placeholder="0.00">
                                <span class="input-group-text">MAD</span>
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('price')}"
                                     th:errors="*{price}">Erreur</div>
                            </div>
                        </div>

                        <!-- QUANTITÉ -->
                        <div class="mb-3">
                            <label for="quantity" class="form-label fw-semibold">
                                <i class="bi bi-archive me-1"></i>Quantité
                                <span class="text-danger">*</span>
                            </label>
                            <input type="number"
                                   id="quantity"
                                   th:field="*{quantity}"
                                   th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid' : ''"
                                   class="form-control"
                                   min="0"
                                   placeholder="0">
                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('quantity')}"
                                 th:errors="*{quantity}">Erreur</div>
                        </div>

                        <!-- DISPONIBLE -->
                        <div class="mb-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input"
                                       type="checkbox"
                                       id="available"
                                       th:field="*{available}"
                                       role="switch">
                                <label class="form-check-label fw-semibold" for="available">
                                    <i class="bi bi-check-circle me-1"></i>Disponible en stock
                                </label>
                            </div>
                        </div>

                        <!-- BOUTONS -->
                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/products}"
                               class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Annuler
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Enregistrer
                            </button>
                        </div>

                    </form>
                </div>
            </div>

            <!-- AIDE -->
            <div class="alert alert-info mt-3 small">
                <i class="bi bi-info-circle me-1"></i>
                Les champs marqués <strong>*</strong> sont obligatoires.
                Le prix doit être supérieur à 0 MAD.
            </div>

        </div>
    </div>

</div>
</body>
</html>
