<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Products App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #0a3d8f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-header {
            background: linear-gradient(135deg, #0d6efd, #0a3d8f);
            border-radius: 16px 16px 0 0;
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .login-header .icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="card login-card">
                <!-- En-tête -->
                <div class="login-header">
                    <div class="icon"><i class="bi bi-box-seam"></i></div>
                    <h3 class="fw-bold mb-0">Products App</h3>
                    <p class="text-white-50 small mb-0">EMSI — Activité Pratique N°3</p>
                </div>

                <div class="card-body p-4">
                    <h5 class="text-center text-muted mb-4">Connexion</h5>

                    <!-- Alerte erreur -->
                    <div th:if="${param.error}"
                         class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        Identifiant ou mot de passe incorrect.
                    </div>

                    <!-- Alerte déconnexion -->
                    <div th:if="${param.logout}"
                         class="alert alert-success d-flex align-items-center" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        Vous êtes déconnecté avec succès.
                    </div>

                    <!-- Formulaire -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">
                                <i class="bi bi-person me-1"></i>Nom d'utilisateur
                            </label>
                            <input type="text"
                                   id="username"
                                   name="username"
                                   class="form-control"
                                   placeholder="user / admin / manager"
                                   autofocus required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">
                                <i class="bi bi-lock me-1"></i>Mot de passe
                            </label>
                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Se connecter
                        </button>
                    </form>
                </div>

                <!-- Comptes de test -->
                <div class="card-footer bg-light rounded-bottom">
                    <p class="text-muted small text-center mb-2 fw-semibold">
                        <i class="bi bi-info-circle me-1"></i>Comptes de test
                    </p>
                    <div class="row g-1 text-center small">
                        <div class="col-4">
                            <span class="badge bg-secondary w-100">user / 1234</span>
                            <div class="text-muted" style="font-size:0.7rem">Lecture</div>
                        </div>
                        <div class="col-4">
                            <span class="badge bg-primary w-100">admin / admin</span>
                            <div class="text-muted" style="font-size:0.7rem">CRUD</div>
                        </div>
                        <div class="col-4">
                            <span class="badge bg-success w-100">manager/manager</span>
                            <div class="text-muted" style="font-size:0.7rem">Full</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
